# MVTec AD category catalogue.
#
# Shared by training (which categories to train, per-category overrides) and by the
# inference service (which categories the API advertises). `kind` is informational
# (texture vs. object). `train_good` / `test_total` are the published MVTec AD counts
# and are used only for sanity-checking the downloaded dataset.
#
# `published_image_auroc` is the PatchCore image-level AUROC reported in the PatchCore
# paper (Roth et al., 2022) and is used as the baseline the benchmark compares against.

dataset: mvtec_ad

categories:
  - name: bottle
    kind: object
    train_good: 209
    test_total: 83
    published_image_auroc: 1.000
  - name: cable
    kind: object
    train_good: 224
    test_total: 150
    published_image_auroc: 0.995
