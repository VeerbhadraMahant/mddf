# EfficientAD training config (consumed by mddf.training.train).
# max_steps is deliberately below the paper's ~70k: at MVTec AD scale the accuracy
# cost is small and it keeps all 15 categories inside one overnight run on an
# RTX 4060. Bump toward 70000 if a category underperforms.
#
# EfficientAD trains with batch size 1, so an "epoch" is only ~60-400 batches.
# We do NOT set val_check_interval (an int would have to be < that; Lightning
# raises otherwise) — validation runs once per epoch, which is frequent enough
# for the map-normalisation quantiles.

model:
  name: efficient_ad
  model_size: small        # EfficientAD-S; 'medium' if VRAM allows
  teacher_out_channels: 384
  pad_maps: true

data:
  image_size: 256
  train_batch_size: 1      # EfficientAD trains with batch size 1 by design
  eval_batch_size: 16
  # 0 on purpose: with max_steps set, Anomalib adds a progress-bar callback that
  # defines a nested class, which Windows' spawn-based DataLoader workers can't
  # pickle ("Can't get local object ..._FixedRichProgressBar").
  num_workers: 0

trainer:
  accelerator: gpu
  devices: 1
  precision: 32
  # Paper uses ~70000. 3000 keeps all 15 categories inside a bounded laptop run
  # (RTX 4060, ~5-8 min each) — EfficientAD is the latency entry in the study, not
  # the accuracy leader. Raise toward 70000 for a stronger accuracy run.
  max_steps: 3000

optim:
  lr: 0.0001
  weight_decay: 0.00001

export:
  input_shape: [1, 3, 256, 256]
  opset: 17
