name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests deploy
          ruff format --check src tests deploy
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.13'
        with:
          name: coverage
          path: coverage.xml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build SPA (server + client bundles)
        working-directory: web
        run: |
          npm ci
          npm run build
          VITE_INFERENCE=client npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (skip until Dockerfile exists)
        run: |
          if [ -f Dockerfile ]; then
            docker build -t mddf:ci .
          else
            echo "Dockerfile not added yet (pre-M8) — skipping"
          fi
