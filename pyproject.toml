[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mddf"
version = "0.1.0"
description = "Manufacturing Defect Detection — unsupervised visual anomaly detection (PatchCore + EfficientAD) served CPU-only via FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Veerbhadra" }]
keywords = ["anomaly-detection", "patchcore", "efficientad", "mvtec", "manufacturing", "fastapi"]

# Runtime deps are deliberately Torch-free: inference is ONNXRuntime + NumPy so the
# deployed image stays ~800 MB. Training deps live in the [train] optional group.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pillow>=10.4",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.19",
    "huggingface-hub>=0.26",
    "structlog>=24.4",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
train = [
    "anomalib>=2.6",
    "torch>=2.6",
    "torchvision>=0.21",
    "timm>=1.0.9",
    "lightning>=2.6,!=2.6.2,!=2.6.3",
    "scikit-learn>=1.5",
    "scikit-image>=0.24",
    "onnx>=1.17",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "tqdm>=4.66",
]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "types-Pillow",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
mddf = "mddf.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mddf"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
packages = ["mddf"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# The ML stack ships partial/no type info; treat it as untyped rather than
# type-checking its internals or chasing missing re-exports.
module = [
    "cv2.*",
    "anomalib.*",
    "torch.*",
    "torchvision.*",
    "lightning.*",
    "onnxruntime.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "integration: end-to-end tests that exercise the FastAPI app",
    "slow: tests that require model artifacts or a network",
]

[tool.coverage.run]
source = ["src/mddf"]
branch = true
